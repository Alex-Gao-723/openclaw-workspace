<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频笔记助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <span class="header-icon">📹</span>
        <span class="header-title">视频笔记助手</span>
      </div>
      <div class="header-actions">
        <button id="btn-new-note" class="btn btn-sm btn-primary" title="新建笔记">＋ 新建</button>
        <button id="btn-settings" class="btn btn-sm btn-ghost" title="设置">⚙</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- 左侧：笔记列表 -->
      <aside class="sidebar">
        <div class="search-box">
          <input id="search-input" type="text" placeholder="搜索笔记..." autocomplete="off">
        </div>
        <div id="notes-list" class="notes-list">
          <div class="empty-state">加载中...</div>
        </div>
      </aside>

      <!-- 右侧：笔记内容 -->
      <main class="note-content">
        <!-- 空状态 -->
        <div id="panel-empty" class="panel panel-empty">
          <div class="empty-icon">📝</div>
          <p>选择左侧笔记查看内容</p>
          <p class="hint">在视频页面按 <kbd>⌘+Shift+S</kbd> 截图</p>
        </div>

        <!-- 笔记查看/编辑面板 -->
        <div id="panel-note" class="panel panel-note" style="display:none">
          <div class="note-header">
            <div class="note-meta">
              <h2 id="note-title" class="note-title-text"></h2>
              <a id="note-url" class="note-url" href="#" target="_blank"></a>
            </div>
            <div class="note-toolbar">
              <button id="btn-edit" class="btn btn-sm btn-ghost" title="编辑">✏️ 编辑</button>
              <button id="btn-save" class="btn btn-sm btn-primary" title="保存" style="display:none">💾 保存</button>
              <button id="btn-cancel" class="btn btn-sm btn-ghost" title="取消" style="display:none">✕ 取消</button>
              <button id="btn-export" class="btn btn-sm btn-ghost" title="导出为 .md 文件">⬇ 导出</button>
              <button id="btn-delete" class="btn btn-sm btn-danger" title="删除笔记">🗑</button>
            </div>
          </div>

          <!-- 查看模式 -->
          <div id="view-mode" class="note-body">
            <div id="note-rendered" class="markdown-body"></div>
          </div>

          <!-- 编辑模式 -->
          <div id="edit-mode" class="note-body" style="display:none">
            <textarea id="note-editor" class="note-editor" spellcheck="false"></textarea>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 新建笔记对话框 -->
  <div id="modal-new" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>新建笔记</h3>
      <label>
        标题
        <input id="new-title" type="text" placeholder="笔记标题（如：视频名称）" class="input-field">
      </label>
      <label>
        视频链接（可选）
        <input id="new-url" type="text" placeholder="https://..." class="input-field">
      </label>
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn btn-ghost">取消</button>
        <button id="btn-modal-create" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <!-- 删除确认对话框 -->
  <div id="modal-delete" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>确认删除</h3>
      <p>确定要删除这条笔记及所有相关截图吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button id="btn-delete-cancel" class="btn btn-ghost">取消</button>
        <button id="btn-delete-confirm" class="btn btn-danger">删除</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
